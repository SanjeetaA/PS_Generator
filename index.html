<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Password Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .output-box {
            margin-top: 1.25rem;
            display: flex;
            gap: 0.5rem;
        }

        #result {
            flex: 1;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #38bdf8;
            font-family: monospace;
            font-size: 1rem;
        }

        #copyBtn {
            width: auto;
            padding: 0.6rem 1rem;
            background: #10b981;
        }

        #copyBtn:hover {
            background: #059669;
        }

        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Secure Password Generator</h1>
        <label for="length">Password Length (minimum 6):</label>
        <input type="number" id="length" value="12" min="6" max="64" />
        <button onclick="generatePassword()">Generate Password</button>
        <div id="error" class="error"></div>
        <div class="output-box">
            <input type="text" id="result" readonly placeholder="Your password appears here" />
            <button id="copyBtn" onclick="copyPassword()">Copy</button>
        </div>
    </div>

    <script>
        function secureRandomIndex(max) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        }

        function generatePassword() {
            const length = parseInt(document.getElementById("length").value, 10);
            const errorEl = document.getElementById("error");
            errorEl.textContent = "";

            if (isNaN(length) || length < 6) {
                errorEl.textContent = "Please enter a valid number of at least 6.";
                return;
            }

            const lower = "abcdefghijklmnopqrstuvwxyz";
            const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const digits = "0123456789";
            const symbols = "!@#$%^&*()_+-=[]{}|;:,.<>?";
            const all = lower + upper + digits + symbols;

            let chars = [
                lower[secureRandomIndex(lower.length)],
                upper[secureRandomIndex(upper.length)],
                digits[secureRandomIndex(digits.length)],
                symbols[secureRandomIndex(symbols.length)]
            ];

            for (let i = 0; i < length - 4; i++) {
                chars.push(all[secureRandomIndex(all.length)]);
            }

            // Shuffle
            for (let i = chars.length - 1; i > 0; i--) {
                const j = secureRandomIndex(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            document.getElementById("result").value = chars.join("");
        }

        function copyPassword() {
            const result = document.getElementById("result");
            if (!result.value) return;
            navigator.clipboard.writeText(result.value);
            const btn = document.getElementById("copyBtn");
            btn.textContent = "Copied!";
            setTimeout(() => (btn.textContent = "Copy"), 1500);
        }
    </script>
</body>

</html>
